<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Práctica 2 - Generador HSL Corporativo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            background-color: #f8fafc;
        }

        .controls {
            margin-bottom: 30px;
        }

        .box-container {
            display: flex;
            gap: 20px;
        }

        .color-box {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            border: 1px solid #cbd5e1;
        }
    </style>
</head>

<body>
    <h2>Generador de Estados UI (Business Luxury)</h2>
    <div class="controls">
        <label>Selecciona el color base corporativo: </label>
        <input type="color" id="colorPicker" value="#2563eb">
    </div>
    <div class="box-container">
        <div id="boxBase" class="color-box">Base</div>
        <div id="boxHover" class="color-box">Hover (-15% L)</div>
        <div id="boxDisabled" class="color-box">Disabled (0% S)</div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
